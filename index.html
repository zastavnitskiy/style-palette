<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f3ef" />
  <meta name="description" content="A personal visual wardrobe." />
  <title>Palette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="/441294944" aria-label="Palette home">PALETTE</a>
    <p class="owner">USER/<span data-user-id>—</span></p>
    <p class="status"><i aria-hidden="true"></i> <span data-object-count>06</span> OBJECTS</p>
  </header>

  <main>
    <section class="canvas" id="palette" aria-label="Draggable clothing palette">
      <p class="coordinate north">WARDROBE INDEX / 2026</p>
      <p class="coordinate east">DRAG OBJECTS</p>
      <p class="coordinate south">PRIVATE COLLECTION</p>

      <article class="object sweater" data-item-id="cobalt-knit" data-name="COBALT KNIT">
        <img src="/assets/cobalt-knit.png" alt="Oversized cobalt blue knit sweater" draggable="false" />
        <p><b>01</b> COBALT KNIT</p>
        <button class="remove-object" type="button" aria-label="Remove Cobalt Knit">×</button>
      </article>

      <article class="object trousers" data-item-id="wide-trouser" data-name="WIDE TROUSER">
        <img src="/assets/charcoal-trousers.png" alt="Charcoal wide-leg tailored trousers" draggable="false" />
        <p><b>02</b> WIDE TROUSER</p>
        <button class="remove-object" type="button" aria-label="Remove Wide Trouser">×</button>
      </article>

      <article class="object sneakers" data-item-id="sunny-suede" data-name="SUNNY SUEDE">
        <img src="/assets/butter-sneakers.png" alt="Butter yellow suede sneakers" draggable="false" />
        <p><b>03</b> SUNNY SUEDE</p>
        <button class="remove-object" type="button" aria-label="Remove Sunny Suede">×</button>
      </article>

      <article class="object bag" data-item-id="cherry-gloss" data-name="CHERRY GLOSS">
        <img src="/assets/cherry-bag.png" alt="Cherry red glossy shoulder bag" draggable="false" />
        <p><b>04</b> CHERRY GLOSS</p>
        <button class="remove-object" type="button" aria-label="Remove Cherry Gloss">×</button>
      </article>

      <article class="object socks" data-item-id="rooney-socks" data-name="ROONEY SOCKS">
        <img src="/assets/rooney-socks.png?v=2" alt="Rooney recycled-wool socks in red, grey and blue stripes" draggable="false" />
        <a class="object-label" href="https://www.octobre-editions.com/eu-en/product/rooney-socks/red-grey-blue" target="_blank" rel="noopener noreferrer" aria-label="View Rooney Socks at Octobre Editions"><b>05</b> ROONEY SOCKS ↗</a>
        <button class="remove-object" type="button" aria-label="Remove Rooney Socks">×</button>
      </article>

      <article class="object michael" data-item-id="paraboot-michael" data-name="PARABOOT MICHAEL">
        <img src="/assets/paraboot-michael.png" alt="Paraboot Michael derby shoe in dark brown Lisse Café leather" draggable="false" />
        <a class="object-label" href="https://www.paraboot.com/en/men/derbies/michael-marche-ii-marron-lisse-cafe-2/" target="_blank" rel="noopener noreferrer" aria-label="View the Michael in Lisse Café at Paraboot"><b>06</b> PARABOOT MICHAEL ↗</a>
        <button class="remove-object" type="button" aria-label="Remove Paraboot Michael">×</button>
      </article>

      <button class="restore-items" id="restore-items" type="button" hidden>RESTORE <span data-hidden-count>0</span></button>
      <div class="crosshair" aria-hidden="true"><span></span></div>
    </section>
  </main>

  <footer class="rail">
    <p>PERSONAL PALETTE <span>№001</span></p>
    <button type="button" id="copy-api">API / <span>POST /api/items</span></button>
    <p>UPDATED <time datetime="2026-09-27">27.09.26</time></p>
  </footer>

  <div class="toast" role="status" aria-live="polite">
    <span data-toast-message>ENDPOINT COPIED</span>
    <button type="button" id="undo-remove" hidden>UNDO</button>
  </div>
  <script src="/script.js"></script>
</body>
</html>
