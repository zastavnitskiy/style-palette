<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e7e7e2"><meta name="description" content="A personal visual wardrobe.">
<title>Palette</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css">
</head><body>
<main class="palette" id="palette" aria-label="Personal clothing palette"><div class="scene" id="scene"><div class="loading">LOADING PALETTE…</div></div></main>
<div class="controls" id="selection-controls" hidden>
<button type="button" data-action="back" aria-label="Send to back" title="Send to back">⇊</button>
<button type="button" data-action="down" aria-label="Move one layer down" title="Move down">↓</button>
<button type="button" data-action="up" aria-label="Move one layer up" title="Move up">↑</button>
<button type="button" data-action="front" aria-label="Bring to front" title="Bring to front">⇈</button>
<button type="button" data-action="mirror" aria-label="Mirror item" title="Mirror">↔</button>
<button type="button" data-action="copy" aria-label="Copy item" title="Copy item">⧉</button>
<button type="button" data-action="remove" aria-label="Remove item" title="Remove">×</button>
</div>
<a class="shop-button" id="shop-button" href="/441294944/shops" aria-label="Open shops" title="Shops">SHOP</a>
<a class="list-button" id="list-button" href="/441294944/list" aria-label="Open wardrobe list" title="Wardrobe list">☷</a>
<button class="add-button" id="add-button" type="button" aria-label="Add product">+</button>
<form class="intake" id="intake" hidden>
<header><label for="product-input">LINK OR PRODUCT NAME</label><button class="intake-close" id="intake-close" type="button" aria-label="Close add product">×</button></header>
<div class="intake-fields"><input id="product-input" maxlength="500" autocomplete="off" placeholder="Paste a link or type a product" required><button type="submit">ADD</button></div>
<div class="intake-meta"><label for="price-input">PRICE <span>OPTIONAL</span></label><label for="currency-input">CURRENCY</label><input id="price-input" maxlength="32" inputmode="decimal" autocomplete="off" placeholder="0.00"><input id="currency-input" maxlength="8" autocomplete="off" value="EUR" aria-label="Price currency"></div>
<p>It appears immediately and finishes processing in the background.</p></form>
<div class="toast" id="toast" role="status" aria-live="polite"></div><script type="module" src="/script.js"></script>
</body></html>
